# Release the npm package and create the matching GitHub release.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

run-name: "Release ${{ inputs.recovery_tag || inputs.version || inputs.release_type }} from verified main by @${{ github.actor }}"

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format (overrides release_type)"
                required: false
                type: "string"
            recovery_tag:
                description: "Existing annotated vX.Y.Z tag to recover after a partial publish"
                required: false
                type: "string"

concurrency:
    group: "release-pipeline-${{ github.repository }}"
    cancel-in-progress: "${{ false }}"

defaults:
    run:
        shell: "bash"

jobs:
    publish:
        name: "Publish npm package and GitHub release"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        outputs:
            package_name: "${{ steps.version.outputs.package_name }}"
            release_commit: "${{ steps.version.outputs.release_commit }}"
            source_sha: "${{ steps.source.outputs.source_sha }}"
            tag: "${{ steps.version.outputs.tag }}"
            version: "${{ steps.version.outputs.version }}"
        permissions:
            contents: "write"
            id-token: "write"
        env:
            CI: "true"
            DEFAULT_RELEASE_BRANCH: "main"
            NPM_REGISTRY_URL: "https://registry.npmjs.org"
            RELEASE_ASSETS_DIR: "temp/release-assets"
            RELEASE_NOTES_PATH: "temp/release-notes.md"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout verified release branch"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  ref: "${{ env.DEFAULT_RELEASE_BRANCH }}"
                  token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Configure Git for release automation"
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin "${DEFAULT_RELEASE_BRANCH}" --tags

            - name: "Select and verify exact release source"
              id: "source"
              env:
                  RECOVERY_TAG: "${{ inputs.recovery_tag }}"
              run: |
                  set -euo pipefail
                  test "${GITHUB_REF_NAME}" = "${DEFAULT_RELEASE_BRANCH}" || {
                    echo "Dispatch this workflow from ${DEFAULT_RELEASE_BRANCH}, not ${GITHUB_REF_NAME}." >&2
                    exit 1
                  }

                  checked_out_sha=$(git rev-parse HEAD)
                  remote_main_sha=$(git ls-remote --exit-code origin "refs/heads/${DEFAULT_RELEASE_BRANCH}" | cut -f1)
                  recovery=false
                  recovery_tag="${RECOVERY_TAG:-}"
                  source_sha="$remote_main_sha"

                  if [ -n "$recovery_tag" ]; then
                    [[ "$recovery_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                      echo "Invalid recovery_tag '$recovery_tag'. Use vX.Y.Z format." >&2
                      exit 1
                    }
                    git fetch --force origin "refs/tags/${recovery_tag}:refs/tags/${recovery_tag}"
                    test "$(git cat-file -t "refs/tags/${recovery_tag}")" = "tag" || {
                      echo "Recovery requires ${recovery_tag} to be an annotated tag." >&2
                      exit 1
                    }
                    release_commit=$(git rev-parse "refs/tags/${recovery_tag}^{commit}")
                    test "$(git log -1 --pretty=%s "$release_commit")" = "chore: release ${recovery_tag}" || {
                      echo "Recovery tag ${recovery_tag} is not on a recognized release commit." >&2
                      exit 1
                    }
                    test "$(git rev-list --parents -n 1 "$release_commit" | wc -w)" -eq 2 || {
                      echo "Recovery release commit ${release_commit} must have exactly one parent." >&2
                      exit 1
                    }
                    git merge-base --is-ancestor "$release_commit" "$remote_main_sha" || {
                      echo "Recovery release commit ${release_commit} is not contained in current ${DEFAULT_RELEASE_BRANCH}." >&2
                      exit 1
                    }
                    source_sha=$(git rev-parse "${release_commit}^")
                    release_paths=$(git diff-tree --no-commit-id --name-only -r "$release_commit" | LC_ALL=C sort)
                    expected_release_paths=$'package-lock.json\npackage.json'
                    test "$release_paths" = "$expected_release_paths" || {
                      echo "Recovery release commit ${release_commit} changed files outside the version allowlist." >&2
                      exit 1
                    }
                    git checkout --detach "$release_commit"
                    checked_out_sha="$release_commit"
                    recovery=true
                  else
                    test "$checked_out_sha" = "$remote_main_sha" || {
                      echo "Checked-out source ${checked_out_sha} is not current ${DEFAULT_RELEASE_BRANCH} ${remote_main_sha}." >&2
                      exit 1
                    }
                  fi

                  test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
                    echo "The selected release source checkout is not clean." >&2
                    git status --short --untracked-files=all
                    exit 1
                  }
                  {
                    echo "checked_out_sha=$checked_out_sha"
                    echo "recovery=$recovery"
                    echo "recovery_tag=$recovery_tag"
                    echo "source_sha=$source_sha"
                  } >> "$GITHUB_OUTPUT"

            - name: "Setup Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
                  registry-url: "${{ env.NPM_REGISTRY_URL }}"

            - name: "Install the repository npm version"
              run: |
                  set -euo pipefail
                  expected_npm=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  cd "$RUNNER_TEMP"
                  npm install --global --ignore-scripts --no-audit --no-fund "npm@${expected_npm}"
                  test "$(npm --version)" = "$expected_npm"

            - name: "Install dependencies with the repository npm policy"
              run: |
                  set -euo pipefail
                  expected_npm=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  actual_npm=$(npm --version)
                  test "$actual_npm" = "$expected_npm" || {
                    echo "Expected npm ${expected_npm}, received ${actual_npm}." >&2
                    exit 1
                  }
                  npm ci

            - name: "Verify package"
              run: "npm run release:check"

            - name: "Prove verification preserved the checkout"
              run: |
                  set -euo pipefail
                  test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
                    echo "release:check changed the tracked, staged, or untracked checkout." >&2
                    git status --short --untracked-files=all
                    exit 1
                  }
                  test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.checked_out_sha }}"

            - name: "Determine release version and create guarded local tag"
              id: "version"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RECOVERY: "${{ steps.source.outputs.recovery }}"
                  RECOVERY_TAG: "${{ steps.source.outputs.recovery_tag }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail
                  explicit_version="${EXPLICIT_VERSION:-}"
                  release_type="${RELEASE_TYPE:-patch}"

                  if [ -n "$explicit_version" ] && [[ ! "$explicit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid version input '$explicit_version'. Use x.y.z format." >&2
                    exit 1
                  fi
                  case "$release_type" in
                    patch|minor|major) ;;
                    *)
                      echo "Invalid release_type '$release_type'. Allowed: patch, minor, major." >&2
                      exit 1
                      ;;
                  esac

                  recovery="${RECOVERY:-false}"
                  if [ "$recovery" = "true" ]; then
                    test -z "$explicit_version" || {
                      echo "Do not combine version and recovery_tag inputs." >&2
                      exit 1
                    }
                    tag="$RECOVERY_TAG"
                    version="${tag#v}"
                    current_version=$(node -p "require('./package.json').version")
                    test "$current_version" = "$version" || {
                      echo "Recovery tag ${tag} disagrees with package version ${current_version}." >&2
                      exit 1
                    }
                    test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)" || {
                      echo "Recovery tag ${tag} does not point to the selected release commit." >&2
                      exit 1
                    }
                  else
                    head_tags=$(git tag --points-at HEAD --sort=refname)
                    test -z "$head_tags" || {
                      echo "Unexpected tags already point at the release source: ${head_tags//$'\n'/, }." >&2
                      exit 1
                    }
                    if [ -n "$explicit_version" ]; then
                      npm version "$explicit_version" --no-git-tag-version
                    else
                      npm version "$release_type" --no-git-tag-version
                    fi
                    version=$(node -p "require('./package.json').version")
                    tag="v${version}"

                    changed_paths=$(git diff --name-only | LC_ALL=C sort)
                    expected_paths=$'package-lock.json\npackage.json'
                    test "$changed_paths" = "$expected_paths" || {
                      echo "Versioning changed files outside the release allowlist." >&2
                      git status --short --untracked-files=all
                      exit 1
                    }
                    test -z "$(git ls-files --others --exclude-standard)" || {
                      echo "Versioning created untracked files." >&2
                      git status --short --untracked-files=all
                      exit 1
                    }

                    git add -- package.json package-lock.json
                    staged_paths=$(git diff --cached --name-only | LC_ALL=C sort)
                    test "$staged_paths" = "$expected_paths" || {
                      echo "The staged release diff does not match the explicit allowlist." >&2
                      git diff --cached --name-status
                      exit 1
                    }
                    git diff --quiet || {
                      echo "Unstaged tracked changes remain after explicit release staging." >&2
                      git status --short
                      exit 1
                    }
                    git commit -m "chore: release ${tag}"
                    git tag -a "$tag" -m "$tag"
                  fi

                  package_name=$(node -p "require('./package.json').name")
                  release_commit=$(git rev-parse HEAD)
                  {
                    echo "github_release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
                    echo "npm_release_url=https://www.npmjs.com/package/${package_name}/v/${version}"
                    echo "package_name=$package_name"
                    echo "recovery=$recovery"
                    echo "release_commit=$release_commit"
                    echo "tag=$tag"
                    echo "version=$version"
                  } >> "$GITHUB_OUTPUT"

            - name: "Build release commit"
              run: "npm run build"

            - name: "Generate release notes and immutable release assets"
              id: "assets"
              env:
                  EXPECTED_TAG: "${{ steps.version.outputs.tag }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  tag_commit=$(git rev-parse "refs/tags/${EXPECTED_TAG}^{commit}")
                  test "$tag_commit" = "$(git rev-parse HEAD)" || {
                    echo "Tag ${EXPECTED_TAG} does not point to the release commit." >&2
                    exit 1
                  }
                  test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
                    echo "The release build changed the checkout." >&2
                    git status --short --untracked-files=all
                    exit 1
                  }

                  mkdir -p temp "$RELEASE_ASSETS_DIR"
                  npm run --silent changelog:release-notes -- --output "$RELEASE_NOTES_PATH"
                  test -s "$RELEASE_NOTES_PATH" || echo "No release notes were generated by git-cliff." > "$RELEASE_NOTES_PATH"

                  pack_metadata_path="${RELEASE_ASSETS_DIR}/npm-pack.json"
                  npm pack --json --pack-destination "$RELEASE_ASSETS_DIR" > "$pack_metadata_path"
                  tarball_filename=$(node scripts/npm-pack-filename.mjs "$pack_metadata_path")
                  tarball_path="${RELEASE_ASSETS_DIR}/${tarball_filename}"
                  test -f "$tarball_path"

                  safe_package_name=$(printf '%s' "$PACKAGE_NAME" | sed 's/^@//; s#/#-#g')
                  zip_basename="${safe_package_name}-${VERSION}"
                  unpack_dir="temp/release-package"
                  mkdir -p "$unpack_dir"
                  tar -xzf "$tarball_path" -C "$unpack_dir"
                  mv "$unpack_dir/package" "$unpack_dir/$zip_basename"
                  (
                    cd "$unpack_dir"
                    zip -rq "../release-assets/${zip_basename}.zip" "$zip_basename"
                  )
                  zip_path="${RELEASE_ASSETS_DIR}/${zip_basename}.zip"
                  test -f "$zip_path"

                  {
                    echo "tarball_name=$tarball_filename"
                    echo "tarball_path=$tarball_path"
                    echo "tarball_sha256=$(sha256sum "$tarball_path" | cut -d' ' -f1)"
                    echo "zip_name=${zip_basename}.zip"
                    echo "zip_path=$zip_path"
                    echo "zip_sha256=$(sha256sum "$zip_path" | cut -d' ' -f1)"
                  } >> "$GITHUB_OUTPUT"

            - name: "Check immutable public release state"
              id: "public_state"
              env:
                  EXPECTED_TARBALL_NAME: "${{ steps.assets.outputs.tarball_name }}"
                  EXPECTED_TARBALL_PATH: "${{ steps.assets.outputs.tarball_path }}"
                  EXPECTED_TARBALL_SHA256: "${{ steps.assets.outputs.tarball_sha256 }}"
                  EXPECTED_ZIP_NAME: "${{ steps.assets.outputs.zip_name }}"
                  EXPECTED_ZIP_SHA256: "${{ steps.assets.outputs.zip_sha256 }}"
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  RECOVERY: "${{ steps.version.outputs.recovery }}"
                  TAG: "${{ steps.version.outputs.tag }}"
                  VERSION: "${{ steps.version.outputs.version }}"
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  set -euo pipefail
                  npm_error="temp/npm-view-error.txt"
                  if npm view "${PACKAGE_NAME}@${VERSION}" version --json > /dev/null 2> "$npm_error"; then
                    npm_published=true
                    expected_npm_integrity="sha512-$(openssl dgst -sha512 -binary "$EXPECTED_TARBALL_PATH" | openssl base64 -A)"
                    published_npm_integrity=$(npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity)
                    test "$published_npm_integrity" = "$expected_npm_integrity" || {
                      echo "Published npm package ${PACKAGE_NAME}@${VERSION} has integrity ${published_npm_integrity}, expected ${expected_npm_integrity}; refusing recovery." >&2
                      exit 1
                    }
                  elif grep --quiet 'E404' "$npm_error"; then
                    npm ping > /dev/null
                    npm_published=false
                  else
                    cat "$npm_error" >&2
                    exit 1
                  fi

                  github_error="temp/github-release-view-error.txt"
                  release_json="temp/github-release.json"
                  github_release_complete=false
                  github_release_body_matches=false
                  github_tarball_exists=false
                  github_zip_exists=false
                  if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json" 2> "$github_error"; then
                      github_release_exists=true
                      test "$(jq -r '.draft' "$release_json")" = "false" || {
                        echo "Existing release ${TAG} is still a draft." >&2
                        exit 1
                      }
                      test "$(jq -r '.prerelease' "$release_json")" = "false" || {
                        echo "Existing release ${TAG} is unexpectedly marked as a prerelease." >&2
                        exit 1
                      }

                      jq -j '.body // ""' "$release_json" > temp/existing-release-notes.md
                      if cmp --silent "$RELEASE_NOTES_PATH" temp/existing-release-notes.md; then
                        github_release_body_matches=true
                      fi

                      verify_existing_asset() {
                        local expected_name="$1"
                        local expected_sha256="$2"
                        local output_name="$3"
                        local asset_count
                        local asset_id
                        local download_path
                        local actual_sha256

                        asset_count=$(jq --arg name "$expected_name" '[.assets[] | select(.name == $name)] | length' "$release_json")
                        test "$asset_count" -le 1 || {
                          echo "Release ${TAG} has duplicate assets named ${expected_name}." >&2
                          exit 1
                        }
                        if [ "$asset_count" -eq 0 ]; then
                          printf -v "$output_name" '%s' false
                          return
                        fi

                        asset_id=$(jq -r --arg name "$expected_name" '.assets[] | select(.name == $name) | .id' "$release_json")
                        download_path="temp/existing-${expected_name}"
                        gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$download_path"
                        actual_sha256=$(sha256sum "$download_path" | cut -d' ' -f1)
                        test "$actual_sha256" = "$expected_sha256" || {
                          echo "Existing asset ${expected_name} has SHA-256 ${actual_sha256}, expected ${expected_sha256}; refusing to overwrite it." >&2
                          exit 1
                        }
                        printf -v "$output_name" '%s' true
                      }

                      verify_existing_asset "$EXPECTED_TARBALL_NAME" "$EXPECTED_TARBALL_SHA256" github_tarball_exists
                      verify_existing_asset "$EXPECTED_ZIP_NAME" "$EXPECTED_ZIP_SHA256" github_zip_exists
                      if [ "$github_release_body_matches" = "true" ] && [ "$github_tarball_exists" = "true" ] && [ "$github_zip_exists" = "true" ]; then
                        github_release_complete=true
                      fi
                  elif grep --quiet 'HTTP 404' "$github_error"; then
                    github_release_exists=false
                  else
                    cat "$github_error" >&2
                    exit 1
                  fi

                  if [ "$RECOVERY" != "true" ] && { [ "$npm_published" = "true" ] || [ "$github_release_exists" = "true" ]; }; then
                    echo "Version ${VERSION} or release ${TAG} already exists; refusing a new release." >&2
                    exit 1
                  fi
                  if [ "$RECOVERY" = "true" ] && [ "$npm_published" = "true" ] && [ "$github_release_complete" = "true" ]; then
                    echo "Release ${TAG} is already complete; refusing a redundant rerun." >&2
                    exit 1
                  fi

                  {
                    echo "github_release_body_matches=$github_release_body_matches"
                    echo "github_release_complete=$github_release_complete"
                    echo "github_release_exists=$github_release_exists"
                    echo "github_tarball_exists=$github_tarball_exists"
                    echo "github_zip_exists=$github_zip_exists"
                    echo "npm_published=$npm_published"
                  } >> "$GITHUB_OUTPUT"

            - name: "Atomically push release commit and annotated tag"
              if: "steps.version.outputs.recovery != 'true'"
              env:
                  SOURCE_SHA: "${{ steps.source.outputs.source_sha }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail
                  remote_sha=$(git ls-remote --exit-code origin "refs/heads/${DEFAULT_RELEASE_BRANCH}" | cut -f1)
                  test "$remote_sha" = "$SOURCE_SHA" || {
                    echo "${DEFAULT_RELEASE_BRANCH} advanced from ${SOURCE_SHA} to ${remote_sha}; refusing release." >&2
                    exit 1
                  }
                  test -z "$(git ls-remote origin "refs/tags/${TAG}")" || {
                    echo "Remote tag ${TAG} already exists." >&2
                    exit 1
                  }
                  git push --atomic origin "HEAD:refs/heads/${DEFAULT_RELEASE_BRANCH}" "refs/tags/${TAG}:refs/tags/${TAG}"

            - name: "Publish the exact release tarball to npm"
              if: "steps.public_state.outputs.npm_published != 'true'"
              run: "npm publish '${{ steps.assets.outputs.tarball_path }}' --access public --provenance --ignore-scripts"

            - name: "Create GitHub release from the same tarball"
              if: "steps.public_state.outputs.github_release_exists != 'true'"
              uses: "softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b" # v3.0.1
              with:
                  tag_name: "${{ steps.version.outputs.tag }}"
                  name: "${{ steps.version.outputs.tag }}"
                  body_path: "${{ env.RELEASE_NOTES_PATH }}"
                  draft: false
                  files: |
                      ${{ steps.assets.outputs.tarball_path }}
                      ${{ steps.assets.outputs.zip_path }}
                  fail_on_unmatched_files: true
                  generate_release_notes: false
                  overwrite_files: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Repair existing GitHub release metadata"
              if: "steps.public_state.outputs.github_release_exists == 'true' && steps.public_state.outputs.github_release_body_matches != 'true'"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  gh release edit "$TAG" --notes-file "$RELEASE_NOTES_PATH" --title "$TAG" --draft=false --prerelease=false

            - name: "Upload a missing npm tarball to the existing GitHub release"
              if: "steps.public_state.outputs.github_release_exists == 'true' && steps.public_state.outputs.github_tarball_exists != 'true'"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  gh release upload "$TAG" "${{ steps.assets.outputs.tarball_path }}"

            - name: "Upload a missing zip to the existing GitHub release"
              if: "steps.public_state.outputs.github_release_exists == 'true' && steps.public_state.outputs.github_zip_exists != 'true'"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  gh release upload "$TAG" "${{ steps.assets.outputs.zip_path }}"

            - name: "Verify the completed public release"
              env:
                  EXPECTED_TARBALL_NAME: "${{ steps.assets.outputs.tarball_name }}"
                  EXPECTED_TARBALL_PATH: "${{ steps.assets.outputs.tarball_path }}"
                  EXPECTED_TARBALL_SHA256: "${{ steps.assets.outputs.tarball_sha256 }}"
                  EXPECTED_ZIP_NAME: "${{ steps.assets.outputs.zip_name }}"
                  EXPECTED_ZIP_SHA256: "${{ steps.assets.outputs.zip_sha256 }}"
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  TAG: "${{ steps.version.outputs.tag }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  published_version=""
                  for _attempt in {1..12}; do
                    published_version=$(npm view "${PACKAGE_NAME}@${VERSION}" version 2> /dev/null || true)
                    [ "$published_version" = "$VERSION" ] && break
                    sleep 5
                  done
                  test "$published_version" = "$VERSION" || {
                    echo "npm did not expose ${PACKAGE_NAME}@${VERSION} after 12 attempts." >&2
                    exit 1
                  }
                  expected_npm_integrity="sha512-$(openssl dgst -sha512 -binary "$EXPECTED_TARBALL_PATH" | openssl base64 -A)"
                  published_npm_integrity=$(npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity)
                  test "$published_npm_integrity" = "$expected_npm_integrity" || {
                    echo "Published npm package has integrity ${published_npm_integrity}, expected ${expected_npm_integrity}." >&2
                    exit 1
                  }
                  release_json="temp/completed-github-release.json"
                  gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"
                  test "$(jq -r '.draft' "$release_json")" = "false"
                  test "$(jq -r '.prerelease' "$release_json")" = "false"
                  jq -j '.body // ""' "$release_json" > temp/completed-release-notes.md
                  cmp --silent "$RELEASE_NOTES_PATH" temp/completed-release-notes.md

                  verify_published_asset() {
                    local expected_name="$1"
                    local expected_sha256="$2"
                    local asset_id
                    local downloaded_path
                    local actual_sha256

                    test "$(jq --arg name "$expected_name" '[.assets[] | select(.name == $name)] | length' "$release_json")" -eq 1
                    asset_id=$(jq -r --arg name "$expected_name" '.assets[] | select(.name == $name) | .id' "$release_json")
                    downloaded_path="temp/completed-${expected_name}"
                    gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$downloaded_path"
                    actual_sha256=$(sha256sum "$downloaded_path" | cut -d' ' -f1)
                    test "$actual_sha256" = "$expected_sha256" || {
                      echo "Published asset ${expected_name} has SHA-256 ${actual_sha256}, expected ${expected_sha256}." >&2
                      exit 1
                    }
                  }

                  verify_published_asset "$EXPECTED_TARBALL_NAME" "$EXPECTED_TARBALL_SHA256"
                  verify_published_asset "$EXPECTED_ZIP_NAME" "$EXPECTED_ZIP_SHA256"

            - name: "Release summary"
              if: "${{ !cancelled() }}"
              run: |
                  {
                    echo "## Release Summary"
                    echo ""
                    echo "- Source SHA: \`${{ steps.source.outputs.source_sha }}\`"
                    echo "- Release commit: \`${{ steps.version.outputs.release_commit }}\`"
                    echo "- Recovery mode: \`${{ steps.version.outputs.recovery }}\`"
                    echo "- Package: \`${{ steps.version.outputs.package_name }}\`"
                    echo "- Version: \`${{ steps.version.outputs.version }}\`"
                    echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
                    echo "- npm package: [${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.version }}](${{ steps.version.outputs.npm_release_url }})"
                    echo "- GitHub release: [${{ steps.version.outputs.tag }}](${{ steps.version.outputs.github_release_url }})"
                    echo "- npm/GitHub tarball SHA-256: \`${{ steps.assets.outputs.tarball_sha256 }}\`"
                    echo "- Zip SHA-256: \`${{ steps.assets.outputs.zip_sha256 }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
